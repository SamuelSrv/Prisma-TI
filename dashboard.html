<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Dashboard Operacional</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Chart.js e Plugin de DataLabels para exibir porcentagens -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body>
    <div class="layout-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Visão Geral da Operação</h1>
                    <p class="subtitle">Acompanhe os principais indicadores e volumetria</p>
                </div>
                <!-- Seletor de Mês/Ano Interativo -->
                <div
                    style="display: flex; align-items: center; gap: 12px; background: var(--bg-main); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-color);">
                    <label for="filtro-mes"
                        style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">MÊS EM
                        EXIBIÇÃO:</label>
                    <input type="month" id="filtro-mes" value="2026-04"
                        style="width: auto; padding: 6px 10px; margin-top: 0;">
                </div>
            </div>

            <!-- Cards de KPIs Zerados e Identificados -->
            <div class="kpi-grid">
                <div class="card kpi-card">
                    <span>Total de Ligações (Mês)</span>
                    <h2 id="kpi-ligacoes-mes">0</h2>
                </div>
                <div class="card kpi-card">
                    <span>Total de Ligações (Semana)</span>
                    <h2 id="kpi-ligacoes-semana">0</h2>
                </div>
                <div class="card kpi-card">
                    <span>Atendimentos (Chat x Ligação)</span>
                    <h2 id="kpi-atendimentos" style="font-size: 1.8rem; margin-top: 12px;">0 / 0</h2>
                </div>
                <div class="card kpi-card alert">
                    <span>Abandonos na Semana</span>
                    <h2 id="kpi-abandonos">0</h2>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-card">
                    <h3>Distribuição de Chamadas por Status (Com Porcentagens)</h3>
                    <canvas id="chartVolumetria" style="max-height: 280px;"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Volume por Mídia (Chat x Ligação)</h3>
                    <canvas id="chartMidia" style="max-height: 280px;"></canvas>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>

</html>
