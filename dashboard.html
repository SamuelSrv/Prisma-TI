<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Dashboard Operacional</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="layout-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="assets/img/logo.svg" alt="Logo" class="logo-sidebar">
                <h2>Prisma TI</h2>
            </div>
            <nav>
                <a href="dashboard.html" class="active">Visão Geral URA</a>
                <a href="lojas.html">Relatório de Lojas</a>
                <a href="categorias.html">Categorias & PDV</a>
            </nav>
            <button id="btn-logout" class="logout-btn">Sair do Sistema</button>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <h1 class="header-title">Monitoramento de Atendimento</h1>
            <p class="subtitle" style="margin-bottom: 20px;">Importação e Análise de Relatórios URA</p>

            <!-- Card de Upload -->
            <div class="card upload-card">
                <div class="loading-overlay" id="loading-overlay">Processando arquivo...</div>
                <h3>Importar Relatório</h3>
                <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Selecione o arquivo exportado para salvar os dados no banco.</p>
                
                <div class="upload-section">
                    <input type="file" id="file-input" accept=".html,.htm,.csv,.txt">
                    <button type="button" id="btn-processar" class="btn">Processar e Salvar</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Chamada correta do arquivo externo -->
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
