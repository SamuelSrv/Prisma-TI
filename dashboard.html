<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Dashboard Operacional</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn.apply(console, args);
        };
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body class="bg-slate-900 text-slate-100 overflow-hidden">
    <!-- Container mestre travado no tamanho da tela -->
    <div class="layout-container flex h-screen w-full">
        
        <!-- Sidebar fixa lateral -->
        <aside class="sidebar shrink-0"></aside>
        
        <!-- Main rolável apenas no eixo Y -->
        <main class="main-content flex-1 overflow-y-auto overflow-x-hidden p-6 lg:p-10 box-border">
            
            <!-- Cabeçalho Responsivo -->
            <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-6 mb-8">
                <div>
                    <h1 class="text-2xl lg:text-3xl font-bold">Visão Geral da Operação</h1>
                    <p class="text-slate-400 mt-1">Acompanhe os principais indicadores e volumetria do mês</p>
                </div>
                
                <!-- Seletor de Mês -->
                <div class="flex items-center gap-3 bg-slate-800 p-3 lg:px-5 rounded-xl border border-slate-700">
                    <label for="filtro-mes" class="text-xs font-bold text-slate-400 tracking-wider">MÊS EM EXIBIÇÃO:</label>
                    <input type="month" id="filtro-mes" value="2026-06" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg border border-slate-700 font-semibold outline-none cursor-pointer focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- Cards de KPIs (Grid responsivo) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">
                <div class="card kpi-card bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total de Atendimentos (Mês)</span>
                    <h2 id="kpi-ligacoes-mes" class="text-4xl font-bold text-white mt-3">0</h2>
                </div>
                <div class="card kpi-card bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atendidas com Sucesso</span>
                    <h2 id="kpi-ligacoes-semana" class="text-4xl font-bold text-white mt-3">0</h2>
                </div>
                <div class="card kpi-card bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atendimentos (Chat x Ligação)</span>
                    <h2 id="kpi-atendimentos" class="text-3xl font-bold text-white mt-3">0 / 0</h2>
                </div>
                <div class="card kpi-card alert bg-slate-800 p-6 rounded-xl border border-red-500/30 flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Abandonos / Perdidos</span>
                    <h2 id="kpi-abandonos" class="text-4xl font-bold text-red-400 mt-3">0</h2>
                </div>
            </div>

            <!-- Gráficos (Grid responsivo) -->
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div class="chart-card bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-white text-lg font-semibold mb-6">Distribuição de Chamadas por Status</h3>
                    <div class="relative w-full h-[300px]">
                        <canvas id="chartVolumetria"></canvas>
                    </div>
                </div>
                <div class="chart-card bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-white text-lg font-semibold mb-6">Volume por Mídia (Chat x Ligação)</h3>
                    <div class="relative w-full h-[300px]">
                        <canvas id="chartMidia"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>

</html>
