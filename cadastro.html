<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Criar Conta</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <img src="assets/img/logo.svg" alt="Logo da Empresa" class="logo-login">

            <p class="subtitle">Cadastro de Novo Usuário</p>

            <form id="cadastro-form">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" required maxlength="14" placeholder="000.000.000-00" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="email">E-mail Corporativo</label>
                    <input type="email" id="email" required placeholder="nome@empresa.com.br" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Crie uma Senha</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6"
                        autocomplete="new-password">
                </div>

                <button type="submit" id="btn-cadastrar" class="btn">Criar Minha Conta</button>
                <p class="error-msg" id="cadastro-error"></p>

                <div style="margin-top: 15px; font-size: 0.9rem;">
                    <a href="index.html"
                        style="color: var(--cor-primaria); text-decoration: none; font-weight: bold;">Já tenho uma
                        conta. Voltar ao Login.</a>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="assets/js/cadastro.js"></script>
</body>

</html>
