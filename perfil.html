<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Perfil do Usuário</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="layout-container">
        <!-- Menu Lateral Injetado via JavaScript -->
        <aside class="sidebar"></aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Perfil do Usuário</h1>
                    <p class="subtitle">Informações cadastrais e credenciais de acesso</p>
                </div>
            </div>

            <div class="card" style="max-width: 600px; padding: 30px;">
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem;">Nome Completo:</label>
                    <input type="text" id="perfil-nome" class="input-modern" readonly style="background-color: var(--bg-main); cursor: default;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem;">E-mail:</label>
                    <input type="email" id="perfil-email" class="input-modern" readonly style="background-color: var(--bg-main); cursor: default;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem;">CPF:</label>
                    <input type="text" id="perfil-cpf" class="input-modern" readonly style="background-color: var(--bg-main); cursor: default;">
                </div>

                <div style="margin-bottom: 10px;">
                    <label style="font-weight: 600; display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem;">Perfil / Função:</label>
                    <input type="text" id="perfil-cargo" class="input-modern" readonly style="background-color: var(--bg-main); cursor: default;">
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="assets/js/perfil.js"></script>
</body>
</html>
