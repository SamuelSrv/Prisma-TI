<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Meu Perfil</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
</head>

<body>
    <div class="layout-container">
        <!-- O Menu Lateral será injetado aqui pelo JS -->
        <aside class="sidebar"></aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Meu Perfil</h1>
                    <p class="subtitle">Informações cadastrais e credenciais de acesso</p>
                </div>
            </div>

            <!-- Card de Informações do Usuário -->
            <div class="card" style="max-width: 600px; padding: 40px; margin-top: 20px;">
                <div
                    style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
                    <div style="width: 64px; height: 64px; background-color: var(--accent-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; color: #fff;"
                        id="avatar-iniciais">
                        --
                    </div>
                    <div>
                        <h2 id="display-nome" style="color: var(--text-primary); font-size: 1.3rem;">Carregando...</h2>
                        <span id="display-cargo"
                            style="color: var(--accent-primary); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;">...</span>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <label
                        style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">Nome
                        Completo:</label>
                    <input type="text" id="perfil-nome" class="input-modern" readonly
                        style="background-color: rgba(255,255,255,0.02); cursor: not-allowed; color: var(--text-secondary);">
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <label
                        style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">E-mail
                        de Acesso:</label>
                    <input type="email" id="perfil-email" class="input-modern" readonly
                        style="background-color: rgba(255,255,255,0.02); cursor: not-allowed; color: var(--text-secondary);">
                </div>

                <div class="input-group" style="margin-bottom: 30px;">
                    <label
                        style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">CPF:</label>
                    <input type="text" id="perfil-cpf" class="input-modern" readonly
                        style="background-color: rgba(255,255,255,0.02); cursor: not-allowed; color: var(--text-secondary);">
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="assets/js/perfil.js"></script>
</body>

</html>
