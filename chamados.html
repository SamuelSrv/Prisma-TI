<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Relatório de Chamados (Qualitor)</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn.apply(console, args);
        };
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    
    <aside class="sidebar w-64 bg-slate-950 border-r border-slate-800 flex-shrink-0 h-screen sticky top-0"></aside>
    
    <main class="main-content flex-1 p-10 overflow-y-auto w-full relative">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white">Relatório de Chamados (Qualitor)</h1>
            <p class="text-slate-400 mt-2">Importe bases CSV e gere apresentações executivas customizadas por equipe.</p>
        </div>

        <!-- MÓDULO 1: IMPORTAR DADOS -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg mb-8">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i> Importar Base CSV</h2>
            <div class="flex items-end gap-4">
                <div class="flex-1">
                    <input type="file" id="arquivo-csv" accept=".csv" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg">
                </div>
                <button id="btn-importar" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg font-semibold transition shadow-lg w-48">
                    Processar CSV
                </button>
            </div>
            <p id="msg-importacao" class="text-sm mt-3 text-emerald-400 hidden"></p>
        </div>

        <!-- MÓDULO 2: SELEÇÃO DE EQUIPE E PERÍODO -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex gap-4 items-end flex-wrap">
            <div class="flex-1 min-w-[220px]">
                <label class="block text-sm font-medium text-slate-400 mb-1">Selecione a Equipe</label>
                <select id="select-equipe" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none focus:border-emerald-500">
                    <option value="field">Field Service</option>
                    <option value="ura" disabled>URA (Em Breve)</option>
                    <option value="noc" disabled>NOC (Em Breve)</option>
                    <option value="office" disabled>Office Desk (Em Breve)</option>
                    <option value="sustentacao" disabled>Sustentação (Em Breve)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Data Inicial</label>
                <input id="date-start" type="text" class="w-40 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none" placeholder="dd/mm/aaaa" readonly>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Data Final</label>
                <input id="date-end" type="text" class="w-40 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none" placeholder="dd/mm/aaaa" readonly>
            </div>
            <button id="btn-gerar" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-semibold transition shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-file-pdf"></i> Gerar Apresentação
            </button>
        </div>
    </main>

    <!-- Modal de Visualização (Slides) -->
    <div id="modal-apresentacao" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex-col items-center overflow-y-auto pb-10" style="z-index: 9999;">
        <div class="w-full bg-slate-900 border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg mb-8">
            <div id="modal-titulo-topo" class="text-white font-bold text-lg flex items-center gap-3">
                <i class="fa-solid fa-desktop text-emerald-500"></i> Relatório Executivo - Grupo Lebes
            </div>
            <div class="flex gap-4">
                <button id="btn-exportar-pdf" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-bold transition shadow-lg">Exportar PDF</button>
                <button id="btn-fechar-modal" class="bg-slate-700 hover:bg-slate-600 text-white w-10 h-10 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        
        <div id="modal-slides-content" class="flex flex-col items-center gap-8"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script type="module" src="assets/js/chamados.js"></script>
</body>
</html>
