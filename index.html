<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Autenticação</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.login-body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background-color: var(--bg-main); position: relative;
        }
        .login-card {
            width: 100%; max-width: 420px; padding: 40px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .login-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .login-brand img { width: 80px; height: 80px; filter: brightness(0) invert(1); object-fit: contain; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .password-container { position: relative; }
        .password-container input { padding-right: 45px; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--text-secondary); display: flex;
        }
        .toggle-password:hover { color: var(--text-primary); }
        .field-error { color: var(--danger); font-size: 0.75rem; margin-top: 4px; display: none; }
        .btn-action {
            width: 100%; padding: 14px; background-color: var(--accent-primary); color: #fff;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background-color 0.2s; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-action:hover { background-color: var(--accent-hover); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
        .global-msg { font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; font-weight: 600; }
        .msg-error { color: var(--danger); }
        .msg-success { color: #10b981; }
        .toggle-form { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary); }
        .toggle-form a { color: var(--accent-primary); text-decoration: none; font-weight: 600; }
        .toggle-form a:hover { text-decoration: underline; }
        .login-footer { position: absolute; bottom: 20px; font-size: 0.8rem; color: var(--text-secondary); opacity: 0.7; }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-brand">
            <img src="assets/img/logo.svg" alt="Logo Prisma TI">
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="form-login">
            <div class="input-group">
                <label for="login-email">E-mail Corporativo</label>
                <input type="email" id="login-email" class="input-modern" placeholder="seu.email@empresa.com" required>
            </div>
            <div class="input-group">
                <label for="login-password">Senha</label>
                <div class="password-container">
                    <input type="password" id="login-password" class="input-modern" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" data-target="login-password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btn-login" class="btn-action">Entrar no Sistema</button>
            <p id="msg-login" class="global-msg msg-error"></p>
            <div class="toggle-form">
                <span>Não possui acesso? </span><a href="#" id="go-to-cadastro">Cadastre-se</a>
            </div>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="form-cadastro" style="display: none;">
            <div class="input-group">
                <label for="cad-nome">Nome Completo</label>
                <input type="text" id="cad-nome" class="input-modern" placeholder="Nome Sobrenome" required>
            </div>
            <div class="input-group">
                <label for="cad-email">E-mail Corporativo</label>
                <input type="email" id="cad-email" class="input-modern" placeholder="seu.email@empresa.com" required>
                <span id="err-email" class="field-error"></span>
            </div>
            <div class="input-group">
                <label for="cad-cpf">CPF</label>
                <input type="text" id="cad-cpf" class="input-modern" placeholder="000.000.000-00" required>
                <span id="err-cpf" class="field-error"></span>
            </div>
            <div class="input-group">
                <label for="cad-password">Senha</label>
                <div class="password-container">
                    <input type="password" id="cad-password" class="input-modern" placeholder="Mínimo 6 caracteres" required>
                    <button type="button" class="toggle-password" data-target="cad-password">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <span id="err-password" class="field-error"></span>
            </div>
            <button type="submit" id="btn-cadastro" class="btn-action">Criar Conta</button>
            <p id="msg-cadastro" class="global-msg"></p>
            <div class="toggle-form">
                <span>Já possui conta? </span><a href="#" id="go-to-login">Fazer Login</a>
            </div>
        </form>
    </div>

    <footer class="login-footer">Criado por: Grupo Lebes 2026</footer>
    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
