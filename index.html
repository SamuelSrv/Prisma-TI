<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Login</title>
    
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body class="login-body">

    <div class="login-card">
        <!-- Logo Grande Centralizado -->
        <div class="login-brand">
            <img src="assets/img/logo.svg" alt="Logo Prisma TI">
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="form-login">
            <div class="input-group">
                <label for="login-email">E-mail de Acesso</label>
                <input type="email" id="login-email" class="input-modern" placeholder="seu.email@empresa.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label for="login-password">Senha</label>
                <div class="password-container">
                    <input type="password" id="login-password" class="input-modern" placeholder="••••••••" autocomplete="current-password" required>
                    <button type="button" class="toggle-password" data-target="login-password" title="Mostrar/Ocultar Senha">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-login">Entrar no Sistema</button>
            <p id="global-error"></p>

            <div class="toggle-form">
                <span>Não possui conta? </span>
                <a href="#" id="link-to-cadastro">Cadastre-se aqui</a>
            </div>
        </form>

        <!-- FORMULÁRIO DE CADASTRO SEPARADO -->
        <form id="form-cadastro" style="display: none;">
            <div class="input-group">
                <label for="cad-nome">Nome Completo</label>
                <input type="text" id="cad-nome" class="input-modern" placeholder="Seu nome completo" autocomplete="name" required>
            </div>

            <div class="input-group">
                <label for="cad-email">E-mail Corporativo</label>
                <input type="email" id="cad-email" class="input-modern" placeholder="seu.email@empresa.com" autocomplete="email" required>
                <span id="error-email" class="field-error"></span>
            </div>

            <div class="input-group">
                <label for="cad-cpf">CPF</label>
                <input type="text" id="cad-cpf" class="input-modern" placeholder="000.000.000-00" maxlength="14" autocomplete="off" required>
                <span id="error-cpf" class="field-error"></span>
            </div>

            <div class="input-group">
                <label for="cad-password">Senha (Mín. 8 caracteres, com letras e números)</label>
                <div class="password-container">
                    <input type="password" id="cad-password" class="input-modern" placeholder="••••••••" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="cad-password" title="Mostrar/Ocultar Senha">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <span id="error-password" class="field-error"></span>
            </div>

            <button type="submit" id="btn-cad-submit" class="btn-login">Criar Minha Conta</button>
            <p id="cad-success" class="global-success"></p>
            
            <div class="toggle-form">
                <span>Já possui uma conta? </span>
                <a href="#" id="link-to-login">Faça login</a>
            </div>
        </form>
    </div>

    <!-- Rodapé Discreto -->
    <footer class="login-footer">
        Criado por: Grupo Lebes 2026
    </footer>

    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
