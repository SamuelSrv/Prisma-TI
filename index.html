<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Login</title>
    
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.login-body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-main);
            position: relative;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        /* Estilo atualizado do Logo Centralizado e Legível */
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            text-align: center;
        }
        .login-brand img {
            width: 64px; /* Aumentado para dar destaque e nitidez */
            height: 64px;
            filter: brightness(0) invert(1);
            object-fit: contain;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: var(--accent-hover);
        }
        #login-error {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        /* Estilos do botão de alternar entre Login e Cadastro */
        .toggle-form {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .toggle-form a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .toggle-form a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* Rodapé Discreto */
        .login-footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <!-- Logo apenas na parte superior, grande e sem texto ao lado -->
        <div class="login-brand">
            <img src="assets/img/logo.svg" alt="Logo Prisma TI">
        </div>

        <form id="form-login">
            
            <!-- CAMPOS EXTRAS DE CADASTRO (Ocultos por padrão) -->
            <div id="signup-fields" style="display: none; flex-direction: column;">
                <div class="input-group">
                    <label for="signup-nome">Nome Completo</label>
                    <input type="text" id="signup-nome" class="input-modern" placeholder="Seu nome completo">
                </div>
                
                <div class="input-group">
                    <label for="signup-cpf">CPF</label>
                    <input type="text" id="signup-cpf" class="input-modern" placeholder="Apenas números">
                </div>
            </div>

            <!-- Campos Padrão de Acesso -->
            <div class="input-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" class="input-modern" placeholder="seu.email@empresa.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="input-modern" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="btn-submit" class="btn-login">Entrar no Sistema</button>
            <p id="login-error">E-mail ou senha inválidos.</p>
            
            <div class="toggle-form">
                <span id="toggle-text-pre">Não possui conta? </span>
                <a href="#" id="link-toggle">Cadastre-se aqui</a>
            </div>
        </form>
    </div>

    <!-- Rodapé Discreto -->
    <footer class="login-footer">
        Criado por: Grupo Lebes 2026
    </footer>

    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
