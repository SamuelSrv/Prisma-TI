<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.login-body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-main);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .login-brand img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(1);
        }
        .login-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: var(--accent-hover);
        }
        #login-error {
            color: var(--danger);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        
        /* Estilos do botão de alternar entre Login e Cadastro */
        .toggle-form {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .toggle-form a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .toggle-form a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-brand">
            <img src="assets/img/logo.svg" alt="Logo">
            <h1>Prisma TI</h1>
        </div>

        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail de Acesso</label>
                <input type="email" id="email" class="input-modern" placeholder="seu.email@empresa.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="input-modern" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" id="btn-submit" class="btn-login">Entrar no Sistema</button>
            <p id="login-error">E-mail ou senha inválidos.</p>
            
            <div class="toggle-form">
                <span id="toggle-text-pre">Não possui conta? </span>
                <a href="#" id="link-toggle">Cadastre-se aqui</a>
            </div>
        </form>
    </div>

    <script type="module" src="assets/js/index.js"></script>
</body>
</html>
