<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Avaliações de Atendimento</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 overflow-hidden">
    
    <!-- Container mestre travado no tamanho da tela -->
    <div class="layout-container flex h-screen w-full">
        
        <!-- Sidebar -->
        <aside class="sidebar shrink-0"></aside>

        <!-- Main rolável -->
        <main class="main-content flex-1 overflow-y-auto overflow-x-hidden p-6 lg:p-10 box-border">
            <div class="mb-8">
                <h1 class="text-2xl lg:text-3xl font-bold text-white">Relatório de Avaliações</h1>
                <p class="text-slate-400 mt-2">Importe as pesquisas de satisfação e audite os atendimentos de Ligação e WhatsApp.</p>
            </div>

            <!-- MÓDULO 1: IMPORTAR DADOS -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg mb-8">
                <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i> Importar Avaliações</h2>
                <div class="flex flex-col sm:flex-row items-end gap-4">
                    <div class="flex-1 w-full">
                        <input type="file" id="arquivo-csv-aval" accept=".csv, .xlsx, .xls" multiple
                            class="block w-full text-sm text-slate-400 file:mr-4 file:py-0 file:px-4 file:rounded-l-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg h-[46px] file:h-[46px]">
                    </div>
                    <button id="btn-importar-aval" class="bg-blue-600 hover:bg-blue-500 text-white px-6 h-[46px] rounded-lg font-semibold transition shadow-lg sm:w-56 w-full flex justify-center items-center whitespace-nowrap">
                        Processar Arquivos
                    </button>
                </div>
                <p id="msg-importacao-aval" class="text-sm mt-3 text-emerald-400 hidden"></p>
            </div>

            <!-- MÓDULO 2: GERADOR DE RELATÓRIOS -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex flex-wrap gap-6 items-end justify-between">
                
                <!-- Controles Principais -->
                <div class="flex gap-4 items-end flex-wrap flex-1 min-w-[300px]">
                    <div class="flex-1 min-w-[180px]">
                        <label class="block text-sm font-medium text-slate-400 mb-2">Tipo de Avaliação</label>
                        <select id="select-tipo-aval" class="w-full h-[42px] bg-slate-900 border border-slate-700 rounded-lg px-4 text-white outline-none focus:border-emerald-500">
                            <option value="Ligação">Ligação (Telefonia)</option>
                            <option value="WhatsApp">WhatsApp (Chat)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Data Inicial</label>
                        <input id="date-start-aval" type="text" class="w-32 h-[42px] bg-slate-900 border border-slate-700 rounded-lg px-4 text-white outline-none" placeholder="dd/mm/aaaa">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Data Final</label>
                        <input id="date-end-aval" type="text" class="w-32 h-[42px] bg-slate-900 border border-slate-700 rounded-lg px-4 text-white outline-none" placeholder="dd/mm/aaaa">
                    </div>
                    <button id="btn-gerar-aval" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 h-[42px] rounded-lg font-semibold transition shadow-lg flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-list-check"></i> Gerar Relatório
                    </button>
                </div>

                <!-- Divisor Responsivo (Linha no PC) -->
                <div class="hidden xl:block w-px h-[42px] bg-slate-700"></div>

                <!-- Controle Consolidado -->
                <div class="flex gap-4 items-end flex-wrap w-full xl:w-auto border-t border-slate-700 xl:border-0 pt-4 xl:pt-0">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Ano Base</label>
                        <input id="ano-consolidado" type="number" value="2026" class="w-24 h-[42px] bg-slate-900 border border-slate-700 rounded-lg px-4 text-white outline-none text-center font-bold">
                    </div>
                    <!-- A classe whitespace-nowrap garante que o texto "Visão Geral Anual" não quebre -->
                    <button id="btn-gerar-consolidado" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 h-[42px] rounded-lg font-semibold transition shadow-lg flex items-center justify-center gap-2 whitespace-nowrap w-full sm:w-auto">
                        <i class="fa-solid fa-calendar-days"></i> Visão Geral Anual
                    </button>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal de Visualização (Tela Cheia) -->
    <div id="modal-relatorio-aval" class="fixed inset-0 bg-slate-900 z-50 hidden flex-col overflow-y-auto" style="z-index: 9999;">
        <div class="w-full bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
            <div class="text-white font-bold text-lg flex items-center gap-3">
                <i class="fa-solid fa-star text-emerald-500"></i> Painel de Auditoria e Qualidade
            </div>
            <div class="flex gap-4">
                <button id="btn-fechar-modal-aval" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
        <div id="conteudo-relatorio-aval" class="p-8 w-full max-w-[1400px] mx-auto"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script type="module" src="assets/js/avaliacoes.js"></script>
</body>

</html>
