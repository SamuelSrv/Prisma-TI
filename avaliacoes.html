<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Avaliações de Atendimento</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen">
    
    <aside class="sidebar w-64 bg-slate-950 border-r border-slate-800 flex-shrink-0 h-screen sticky top-0"></aside>
    
    <main class="main-content flex-1 p-10 overflow-y-auto w-full relative">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white">Relatório de Avaliações</h1>
            <p class="text-slate-400 mt-2">Importe as pesquisas de satisfação e audite os atendimentos de Ligação e WhatsApp.</p>
        </div>

        <!-- MÓDULO 1: IMPORTAR DADOS -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg mb-8">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i> Importar Avaliações (CSV)</h2>
            <div class="flex items-end gap-4">
                <div class="flex-1">
                    <input type="file" id="arquivo-csv-aval" accept=".csv" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg">
                </div>
                <button id="btn-importar-aval" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-lg font-semibold transition shadow-lg w-48">
                    Processar CSV
                </button>
            </div>
            <p id="msg-importacao-aval" class="text-sm mt-3 text-emerald-400 hidden"></p>
        </div>

        <!-- MÓDULO 2: GERADOR DE RELATÓRIOS -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg flex gap-4 items-end flex-wrap">
            <div class="flex-1 min-w-[220px]">
                <label class="block text-sm font-medium text-slate-400 mb-1">Tipo de Avaliação</label>
                <select id="select-tipo-aval" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none focus:border-emerald-500">
                    <option value="Ligação">Ligação (Telefonia)</option>
                    <option value="WhatsApp">WhatsApp (Chat)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Data Inicial</label>
                <input id="date-start-aval" type="text" class="w-40 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none" placeholder="dd/mm/aaaa">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Data Final</label>
                <input id="date-end-aval" type="text" class="w-40 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none" placeholder="dd/mm/aaaa">
            </div>
            <button id="btn-gerar-aval" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-semibold transition shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-chart-pie"></i> Gerar Relatório
            </button>
        </div>
    </main>

    <!-- Modal de Visualização (Tela Cheia) -->
    <div id="modal-relatorio-aval" class="fixed inset-0 bg-slate-900 z-50 hidden flex-col overflow-y-auto" style="z-index: 9999;">
        <div class="w-full bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center shadow-lg">
            <div class="text-white font-bold text-lg flex items-center gap-3">
                <i class="fa-solid fa-star text-emerald-500"></i> Painel de Auditoria e Qualidade
            </div>
            <div class="flex gap-4">
                <button id="btn-fechar-modal-aval" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
            </div>
        </div>
        <div id="conteudo-relatorio-aval" class="p-8 w-full max-w-[1400px] mx-auto"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script type="module" src="assets/js/avaliacoes.js"></script>
</body>
</html>
