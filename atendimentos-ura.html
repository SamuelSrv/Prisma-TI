<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const originalWarn = console.warn;
        console.warn = function (...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn.apply(console, args);
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="bg-slate-900 text-slate-100">
    <div class="layout-container">
        <!-- Menu Lateral -->
        <aside class="sidebar"></aside>

        <main class="main-content" style="padding: 40px; width: 100%;">

            <!-- TELA DE FILTROS LIMPA -->
            <div id="area-filtros">
                <div class="page-header-flex" style="margin-bottom: 30px;">
                    <div>
                        <h1 class="header-title" style="font-size: 1.8rem; font-weight: 700;">Gerar Apresentação URA &
                            Chat</h1>
                        <p class="subtitle" style="color: #94a3b8;">Selecione o período para abrir o relatório
                            corporativo completo</p>
                    </div>
                </div>

                <div class="card"
                    style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 800px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                        <div>
                            <label
                                style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">Data
                                Inicial:</label>
                            <input id="date-start" type="text"
                                class="block w-full px-4 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 rounded-lg focus:ring-emerald-500 cursor-pointer"
                                placeholder="Selecione a data" readonly>
                        </div>
                        <div>
                            <label
                                style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">Data
                                Final:</label>
                            <input id="date-end" type="text"
                                class="block w-full px-4 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 rounded-lg focus:ring-emerald-500 cursor-pointer"
                                placeholder="Selecione a data" readonly>
                        </div>
                    </div>

                    <div style="text-align: center;">
                        <button type="button" id="btn-gerar"
                            style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; width: 100%; transition: background 0.2s;">
                            Gerar e Visualizar Apresentação
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SUBJANELA MODAL FLUTUANTE (VISUALIZADOR DA APRESENTAÇÃO) -->
    <div id="modal-apresentacao"
        style="display: none; position: fixed; inset: 0; z-index: 9999; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(6px); justify-content: center; align-items: center; padding: 30px;">
        <div
            style="background: #0f172a; width: 100%; max-width: 1450px; height: 92vh; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);">

            <!-- Barra Superior da Subjanela -->
            <div
                style="display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: #1e293b; border-bottom: 1px solid #334155;">
                <div>
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 600; margin: 0;">Relatório Executivo -
                        Grupo Lebes</h3>
                    <p style="color: #94a3b8; font-size: 0.85rem; margin: 2px 0 0 0;">Visualização de páginas contínuas
                    </p>
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <button type="button" id="btn-exportar-pdf"
                        style="background-color: #ef4444; color: white; padding: 10px 22px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem;">Exportar
                        PDF</button>
                    <button type="button" id="btn-fechar-modal"
                        style="background: #334155; border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s;"
                        title="Fechar">&times;</button>
                </div>
            </div>

            <!-- Conteúdo Rolável (Onde os slides aparecem empilhados para rolar para baixo) -->
            <div id="modal-slides-content"
                style="flex: 1; overflow-y: auto; padding: 50px; background: #090d16; display: flex; flex-direction: column; gap: 50px; align-items: center;">
                <!-- Os slides injetados pelo JS ficam aqui dentro -->
            </div>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="assets/js/atendimentos-ura.js"></script>
</body>

</html>
