<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <!-- Estilização Limpa e Arredondada Estilo Microsoft / Fluent UI -->
    <style>
        .flatpickr-calendar {
            background: #111827 !important;
            border: 1px solid #1f2937 !important;
            border-radius: 16px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
            padding: 20px !important;
            font-family: inherit !important;
            color: #f3f4f6 !important;
            width: 320px !important;
        }
        .flatpickr-months {
            padding: 0 0 15px 0 !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .flatpickr-month {
            background: transparent !important;
            color: #f3f4f6 !important;
            height: auto !important;
            fill: #f3f4f6;
        }
        .flatpickr-current-month {
            font-size: 1.05rem !important;
            font-weight: 500 !important;
            color: #f3f4f6 !important;
            position: static !important;
            width: auto !important;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            font-weight: 600 !important;
            color: #60a5fa !important;
            cursor: pointer;
            padding: 0 !important;
            font-size: 1.05rem !important;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months option {
            background: #1f2937;
            color: #f3f4f6;
        }
        .flatpickr-current-month .numInputWrapper {
            width: auto !important;
        }
        .flatpickr-current-month .numInputWrapper span {
            display: none !important;
        }
        .flatpickr-weekdays {
            background: transparent !important;
            padding: 0 !important;
            margin-bottom: 8px;
        }
        span.flatpickr-weekday {
            background: transparent !important;
            color: #9ca3af !important;
            font-weight: 500 !important;
            font-size: 0.85rem;
        }
        .flatpickr-days {
            border: none !important;
        }
        .flatpickr-day {
            border-radius: 50% !important;
            margin: 2px !important;
            color: #e5e7eb !important;
            background: transparent !important;
            border: none !important;
            font-weight: 400;
            height: 38px !important;
            line-height: 38px !important;
            width: 38px !important;
            max-width: 38px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            transition: background 0.15s ease;
        }
        .flatpickr-day.selected, 
        .flatpickr-day.startRange, 
        .flatpickr-day.endRange {
            background: #2563eb !important;
            border-color: #2563eb !important;
            color: #ffffff !important;
            border-radius: 50% !important;
        }
        .flatpickr-day:hover {
            background: #374151 !important;
            border-radius: 50% !important;
        }
        .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay {
            color: #4b5563 !important;
        }
        .flatpickr-prev-month, .flatpickr-next-month {
            padding: 8px !important;
            border-radius: 50%;
            top: 15px !important;
            background: transparent !important;
            transition: background 0.15s;
        }
        .flatpickr-prev-month:hover, .flatpickr-next-month:hover {
            background: #374151 !important;
        }
        .flatpickr-prev-month svg, .flatpickr-next-month svg {
            fill: #9ca3af !important;
            width: 14px;
            height: 14px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar"></aside>
        
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Gerar Relatório de Atendimentos</h1>
                    <p class="subtitle">Selecione o período exato para gerar a apresentação</p>
                </div>
            </div>

            <div class="card" style="padding: 40px; max-width: 700px; margin: 0 auto;">
                <h3 style="margin-bottom: 25px; color: var(--text-primary); text-align: center;">Selecione o Período</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div>
                        <label for="date-start" style="display:block; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                            Data Inicial:
                        </label>
                        <div style="position: relative; width: 100%;">
                            <div style="position: absolute; inset-y: 0; left: 0; display: flex; align-items: center; padding-left: 12px; pointer-events: none; color: var(--text-secondary);">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input type="text" id="date-start" class="input-modern" placeholder="Selecione a data..." style="padding-left: 40px; text-align: left; font-size: 1rem; padding-top: 12px; padding-bottom: 12px; cursor: pointer; width: 100%; box-sizing: border-box;" readonly>
                        </div>
                    </div>
                    
                    <div>
                        <label for="date-end" style="display:block; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                            Data Final:
                        </label>
                        <div style="position: relative; width: 100%;">
                            <div style="position: absolute; inset-y: 0; left: 0; display: flex; align-items: center; padding-left: 12px; pointer-events: none; color: var(--text-secondary);">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input type="text" id="date-end" class="input-modern" placeholder="Selecione a data..." style="padding-left: 40px; text-align: left; font-size: 1rem; padding-top: 12px; padding-bottom: 12px; cursor: pointer; width: 100%; box-sizing: border-box;" readonly>
                        </div>
                    </div>
                </div>

                <div style="text-align: center;">
                    <button type="button" id="btn-gerar" class="btn-primary-modern" style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer;">
                        Gerar Apresentação
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="assets/js/atendimentos-ura.js"></script>
</body>
</html>
