<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
                return;
            }
            originalWarn.apply(console, args);
        };
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100">
    <div class="layout-container">
        <aside class="sidebar"></aside>
        
        <main class="main-content" style="padding: 40px; width: 100%;">
            <div class="page-header-flex" style="margin-bottom: 30px;">
                <div>
                    <h1 class="header-title" style="font-size: 1.8rem; font-weight: 700;">Gerar Relatório de Atendimentos</h1>
                    <p class="subtitle" style="color: #94a3b8;">Selecione o período exato para gerar a apresentação</p>
                </div>
            </div>

            <div class="card" style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 700px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
                <h3 style="margin-bottom: 25px; color: #f8fafc; text-align: center; font-size: 1.2rem; font-weight: 600;">Selecione o Período</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    
                    <div>
                        <label style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">
                            Data Inicial:
                        </label>
                        <div class="relative max-w-sm">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input id="date-start" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-xs placeholder-slate-400 cursor-pointer" placeholder="Selecione a data" readonly>
                        </div>
                    </div>
                    
                    <div>
                        <label style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">
                            Data Final:
                        </label>
                        <div class="relative max-w-sm">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input id="date-end" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-xs placeholder-slate-400 cursor-pointer" placeholder="Selecione a data" readonly>
                        </div>
                    </div>
                </div>

                <div style="text-align: center;">
                    <button type="button" id="btn-gerar" style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer; background: #059669; color: white; border: none; border-radius: 8px; font-weight: 600;">
                        Gerar Apresentação
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <script type="module" src="assets/js/atendimentos-ura.js"></script>
</body>
</html>
