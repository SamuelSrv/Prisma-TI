<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <!-- Estilização Dark Mode com Dropdowns Elegantes para Mês e Ano -->
    <style>
        .flatpickr-calendar {
            background: #111827 !important;
            border: 1px solid #374151 !important;
            border-radius: 14px !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
            padding: 16px !important;
            color: #f3f4f6 !important;
            font-family: inherit !important;
        }
        .flatpickr-days {
            border: none !important;
        }
        .flatpickr-day {
            border-radius: 8px !important;
            color: #f3f4f6 !important;
            background: transparent !important;
            border: none !important;
            height: 38px !important;
            line-height: 38px !important;
            max-width: 38px !important;
            margin: 2px !important;
        }
        .flatpickr-day.selected, .flatpickr-day.selected:hover {
            background: #2563eb !important;
            color: #ffffff !important;
        }
        .flatpickr-day:hover {
            background: #374151 !important;
        }
        .flatpickr-month, .flatpickr-current-month {
            color: #f3f4f6 !important;
            fill: #f3f4f6 !important;
            height: 45px !important;
        }
        .flatpickr-current-month {
            font-size: 1rem !important;
            font-weight: 600 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            padding-top: 0 !important;
        }
        /* Estilização moderna dos selects de Mês e Ano */
        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year {
            background: #1f2937 !important;
            color: #60a5fa !important;
            border: 1px solid #374151 !important;
            border-radius: 6px !important;
            padding: 4px 8px !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            cursor: pointer !important;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months option {
            background: #111827 !important;
            color: #f3f4f6 !important;
        }
        .flatpickr-current-month .numInputWrapper span {
            display: none !important; /* Remove as setinhas feias do ano */
        }
        span.flatpickr-weekday {
            color: #9ca3af !important;
            font-weight: 600 !important;
        }
        .flatpickr-prev-month, .flatpickr-next-month {
            top: 12px !important;
        }
        .flatpickr-prev-month svg, .flatpickr-next-month svg {
            fill: #9ca3af !important;
        }
        .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg {
            fill: #ffffff !important;
        }
    </style>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
</head>
<body>
    <div class="layout-container">
        <!-- O Menu Lateral será injetado aqui -->
        <aside class="sidebar"></aside>
        
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Gerar Relatório de Atendimentos</h1>
                    <p class="subtitle">Selecione o período exato para gerar a apresentação</p>
                </div>
            </div>

            <!-- Card Limpo e Centralizado -->
            <div class="card" style="padding: 40px; max-width: 700px; margin: 0 auto;">
                <h3 style="margin-bottom: 25px; color: var(--text-primary); text-align: center;">Selecione o Período</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    
                    <!-- Data Inicial com Ícone Perfeitamente Centralizado -->
                    <div>
                        <label for="date-start" style="display:block; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                            Data Inicial:
                        </label>
                        <div style="position: relative; width: 100%;">
                            <div style="position: absolute; top: 50%; left: 14px; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; color: var(--text-secondary);">
                                <svg style="width: 18px; height: 18px;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input type="text" id="date-start" class="input-modern" placeholder="Selecione a data..." style="padding-left: 42px; text-align: left; font-size: 1rem; padding-top: 12px; padding-bottom: 12px; cursor: pointer; width: 100%; box-sizing: border-box;" autocomplete="off">
                        </div>
                    </div>
                    
                    <!-- Data Final com Ícone Perfeitamente Centralizado -->
                    <div>
                        <label for="date-end" style="display:block; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                            Data Final:
                        </label>
                        <div style="position: relative; width: 100%;">
                            <div style="position: absolute; top: 50%; left: 14px; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; color: var(--text-secondary);">
                                <svg style="width: 18px; height: 18px;" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                            </div>
                            <input type="text" id="date-end" class="input-modern" placeholder="Selecione a data..." style="padding-left: 42px; text-align: left; font-size: 1rem; padding-top: 12px; padding-bottom: 12px; cursor: pointer; width: 100%; box-sizing: border-box;" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div style="text-align: center;">
                    <button type="button" id="btn-gerar" class="btn-primary-modern" style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer;">
                        Gerar Apresentação
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script da página -->
    <script type="module" src="assets/js/atendimentos-ura.js"></script>
</body>
</html>
