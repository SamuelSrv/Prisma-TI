<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
            originalWarn.apply(console, args);
        };
    </script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-900 text-slate-100">
    <div class="layout-container">
        <!-- Menu Lateral -->
        <aside class="sidebar"></aside>
        
        <main class="main-content" style="padding: 40px; width: 100%;">
            
            <!-- ÁREA DE FILTROS (Esconde quando o relatório é gerado) -->
            <div id="area-filtros">
                <div class="page-header-flex" style="margin-bottom: 30px;">
                    <div>
                        <h1 class="header-title" style="font-size: 1.8rem; font-weight: 700;">Central de Relatórios</h1>
                        <p class="subtitle" style="color: #94a3b8;">Gere apresentações corporativas com base na volumetria da URA e Chat</p>
                    </div>
                </div>

                <div class="card" style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 800px; margin: 0 auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
                    
                    <h3 style="margin-bottom: 25px; color: #f8fafc; font-size: 1.2rem; font-weight: 600; text-align: center;">Configurar Apresentação</h3>
                    
                    <!-- Seletor do Tipo de Relatório -->
                    <div style="margin-bottom: 25px;">
                        <label style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">
                            Tipo de Relatório:
                        </label>
                        <select id="tipo-relatorio" class="bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5 outline-none cursor-pointer">
                            <option value="categorias">1. Top 10 Categorias & Departamentos</option>
                            <option value="lojas">2. Top 10 Lojas (Categorias x Contatos)</option>
                            <option value="fechamento">3. Fechamento Evolutivo URA Suporte</option>
                            <option value="tma-tme">4. TMAX & TME por Dia (Ligação vs Chat)</option>
                        </select>
                    </div>

                    <!-- Seletores de Data -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                        <div>
                            <label style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">Data Inicial:</label>
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                                </div>
                                <input id="date-start" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-xs placeholder-slate-400 cursor-pointer" placeholder="Selecione a data" readonly>
                            </div>
                        </div>
                        
                        <div>
                            <label style="display:block; font-weight: 600; font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px;">Data Final:</label>
                            <div class="relative w-full">
                                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/></svg>
                                </div>
                                <input id="date-end" type="text" class="block w-full ps-9 pe-3 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 shadow-xs placeholder-slate-400 cursor-pointer" placeholder="Selecione a data" readonly>
                            </div>
                        </div>
                    </div>

                    <div style="text-align: center;">
                        <button type="button" id="btn-gerar" style="padding: 15px 40px; font-size: 1.1rem; cursor: pointer; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; transition: background 0.2s;">
                            Gerar Apresentação
                        </button>
                    </div>
                </div>
            </div>

            <!-- CONTAINER DA APRESENTAÇÃO (Fica oculto até clicar em Gerar) -->
            <div id="container-slides" style="display: none; width: 100%; margin-top: 20px;">
                
                <!-- Barra de Ações do Relatório Gerado -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #1e293b; padding: 15px 25px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button type="button" id="btn-voltar" style="background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600;">← Voltar aos Filtros</button>
                        <h3 id="titulo-preview" style="color: var(--text-primary); font-size: 1.1rem; font-weight: 600;">Pré-visualização do Slide (1920x1080)</h3>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <button type="button" style="background-color: #ef4444; color: white; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600;">Exportar PDF</button>
                    </div>
                </div>

                <!-- O Slide 1920x1080 (O JS vai injetar o HTML correto aqui dentro dependendo do que foi escolhido) -->
                <div style="overflow: auto; max-width: 100%; padding-bottom: 40px;">
                    <div class="slide-wrapper" id="slide-render">
                        <!-- O conteúdo será montado dinamicamente pelo atendimentos-ura.js -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="assets/js/atendimentos-ura.js"></script>
</body>
</html>
