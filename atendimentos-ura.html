<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar"></aside>
        
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Gerar Relatório de Atendimentos</h1>
                    <p class="subtitle">Selecione o período exato para gerar a apresentação executiva</p>
                </div>
            </div>

            <!-- Card Limpo e Profissional para Seleção de Data -->
            <div class="card" style="padding: 40px; max-width: 700px; text-align: center; margin: 0 auto;">
                <h3 style="margin-bottom: 30px; color: var(--text-primary);">Filtro de Período</h3>
                
                <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 35px;">
                    <!-- Data Inicial -->
                    <div style="flex: 1; text-align: left;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">Data Inicial:</label>
                        <input type="date" id="data-inicial" class="input-modern" required>
                    </div>
                    
                    <!-- Data Final -->
                    <div style="flex: 1; text-align: left;">
                        <label style="font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px; display: block;">Data Final:</label>
                        <input type="date" id="data-final" class="input-modern" required>
                    </div>
                </div>

                <button type="button" id="btn-gerar" class="btn-primary-modern" style="padding: 14px 40px; font-size: 1rem; width: 100%;">
                    Processar e Gerar Apresentação
                </button>
            </div>
        </main>
    </div>

    <script type="module">
        import { carregarMenu } from './assets/js/menu.js';
        carregarMenu('gerar-relatorio');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-gerar').addEventListener('click', () => {
                const dataInicio = document.getElementById('data-inicial').value;
                const dataFim = document.getElementById('data-final').value;
                
                if(!dataInicio || !dataFim) {
                    alert('Por favor, preencha ambas as datas para prosseguir.');
                    return;
                }
                if(dataInicio > dataFim) {
                    alert('A Data Inicial não pode ser maior que a Data Final.');
                    return;
                }
                
                alert(`Pesquisando dados de ${dataInicio} até ${dataFim}...`);
            });
        });
    </script>
</body>
</html>
