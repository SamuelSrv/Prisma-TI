<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma TI - Gerar Relatórios</title>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Flatpickr (Efeito Cobrinha nas Datas) e Tema Escuro -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar"></aside>
        
        <main class="main-content">
            <div class="page-header-flex">
                <div>
                    <h1 class="header-title">Gerar Relatório de Atendimentos</h1>
                    <p class="subtitle">Selecione o período exato para gerar a apresentação</p>
                </div>
            </div>

            <!-- Card Limpo focado APENAS no Período -->
            <div class="card" style="padding: 40px; max-width: 700px; text-align: center; margin: 0 auto;">
                <h3 style="margin-bottom: 25px; color: var(--text-primary);">Selecione o Período</h3>
                
                <div style="margin-bottom: 30px;">
                    <label style="display:block; font-weight: 600; font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 10px;">
                        Data Inicial e Data Final:
                    </label>
                    <!-- Input onde o Flatpickr vai operar -->
                    <input type="text" id="date-range" class="input-modern" placeholder="Selecione o período no calendário..." style="text-align: center; font-size: 1.1rem; padding: 15px; cursor: pointer;" readonly>
                </div>

                <button type="button" id="btn-gerar" class="btn-primary-modern" style="padding: 15px 40px; font-size: 1.1rem;">
                    Gerar Apresentação
                </button>
            </div>
            
            <!-- Resto da tela de visualização de PDF/PPT omitida para brevidade (mantém a sua) -->
        </main>
    </div>

    <script type="module" src="assets/js/menu.js"></script>
    <script type="module">
        import { carregarMenu } from './assets/js/menu.js';
        carregarMenu('gerar-relatorio');

        document.addEventListener('DOMContentLoaded', () => {
            // Inicializando o Flatpickr no modo "Range" (Efeito Cobrinha)
            flatpickr("#date-range", {
                mode: "range",
                dateFormat: "d/m/Y",
                locale: "pt",
                showMonths: 2, // Mostra dois meses lado a lado
                theme: "dark"
            });

            document.getElementById('btn-gerar').addEventListener('click', () => {
                const periodo = document.getElementById('date-range').value;
                if(!periodo.includes('até')) {
                    alert('Por favor, selecione a data inicial e a data final.');
                    return;
                }
                alert(`Gerando relatório para o período: ${periodo}`);
            });
        });
    </script>
</body>
</html>
